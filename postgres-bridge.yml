# k3s migration bridge (Phase 3.5): postgres runs on k3s (postgres.databases), the Docker consumers
# (authentik, nextcloud, guacamole, warracker) still connect to "postgres" on the nas network.
# Forwards to the fixed ClusterIP of the postgres Service. Remove with the last Docker consumer.
services:
  postgres:
    image: alpine/socat:latest@sha256:22d77becaeeea8ef56b8c4bb2312323acafe85354be6a85714ff5050e3537842
    container_name: postgres
    hostname: postgres
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:10.43.54.32:5432
    networks:
      - nas
    restart: unless-stopped

networks:
  nas:
    external: true
