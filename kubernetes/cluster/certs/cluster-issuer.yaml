apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: fabigoardou@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            email: fabigoardou@gmail.com
            apiKeySecretRef:            # same global API key as Docker Traefik (CLOUDFLARE_API_KEY)
              name: cloudflare
              key: CLOUDFLARE_API_KEY
