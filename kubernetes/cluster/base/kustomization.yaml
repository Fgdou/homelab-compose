apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - storage-classes.yaml
  - traefik-config.yaml
  - traefik-metrics.yaml
  - lan-only.yaml
# Sablier Traefik plugin v1.3.1 (github.com/sablierapp/sablier-traefik-plugin), vendored so Traefik never downloads it
# (no DNS at boot). Fixed name: referenced from traefik-config.yaml. After changing the files, restart Traefik.
configMapGenerator:
  - name: traefik-plugin-sablier
    namespace: kube-system
    options: { disableNameSuffixHash: true }
    files:
      - sablier-plugin/.traefik.yml
      - sablier-plugin/go.mod
      - sablier-plugin/main.go
      - sablier-plugin/config.go
      - sablier-plugin/version.go
