# Configures the Traefik bundled with k3s (chart traefik 40.1.x, Traefik 3.7).
# Owns 80/443/22 on the NAS since the Phase 4 cutover (2026-10-21; before: 8000/8443/2222 behind Docker Traefik).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        exposedPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        exposedPort: 443
        http:
          encodedCharacters:
            allowEncodedHash: true
            allowEncodedSlash: true
        transport:
          respondingTimeouts:
            readTimeout: 600s
            writeTimeout: 600s
            idleTimeout: 600s
      ssh:
        port: 2222
        exposedPort: 22             # host sshd is on another port
        expose:
          default: true
        protocol: TCP
      metrics:
        port: 8082
    providers:
      kubernetesCRD:
        allowCrossNamespace: true   # authentik Middleware used from every namespace
    additionalArguments:
      - --serversTransport.insecureSkipVerify=true   # MeshCentral serves HTTPS
    experimental:
      localPlugins:
        sablier:                                     # scale-to-zero middleware (infra/sablier.yaml), source in the ConfigMap
          moduleName: github.com/sablierapp/sablier-traefik-plugin
          mountPath: /plugins-local/src/github.com/sablierapp/sablier-traefik-plugin
          type: localPath
          volumeName: sablier-plugin
    deployment:
      additionalVolumes:
        - name: sablier-plugin
          configMap: { name: traefik-plugin-sablier }
    service:
      spec:
        externalTrafficPolicy: Local                 # keep real client IPs
    logs:
      access:
        enabled: false
