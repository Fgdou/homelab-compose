# Admin UIs reachable from the LAN only (was the lan-only ipAllowList of Docker Traefik).
# Used cross-namespace (providers.kubernetesCRD.allowCrossNamespace) by openbao, argocd, adminer.
# Relies on the real client IP reaching Traefik (ServiceLB, externalTrafficPolicy: Local).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: kube-system
spec:
  ipAllowList:
    sourceRange: [10.0.0.0/16]
