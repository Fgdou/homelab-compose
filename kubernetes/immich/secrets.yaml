# DB_PASSWORD and POSTGRES_PASSWORD: same value ("password", kept as is — internal only)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich
  namespace: immich
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: immich
  dataFrom:
    - extract:
        key: immich/immich
