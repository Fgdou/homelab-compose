# Chart immich/immich 0.12.0. The chart targets v2.6.3; images are overridden to the
# version running on Docker (v3.3.3). The database is plain YAML (database.yaml).
controllers:
  main:
    containers:
      main:
        env:
          REDIS_HOSTNAME: redis.databases
          DB_HOSTNAME: immich-database
          DB_USERNAME: user
          DB_DATABASE_NAME: db
          DB_PASSWORD:
            valueFrom:
              secretKeyRef: { name: immich, key: DB_PASSWORD }
          TZ: Europe/Paris
immich:
  persistence:
    library:
      existingClaim: library        # /data/immich/core
server:
  persistence:
    data:
      globalMounts:
        - path: /usr/src/app/upload   # same path as Docker (paths are stored in the database)
  controllers:
    main:
      containers:
        main:
          image:
            tag: "v3.3.3@sha256:bae7664ff3aa4c2c1fcbdcdd86b40b105643c5f861f3e6a770fc760089f25862"
machine-learning:
  controllers:
    main:
      containers:
        main:
          image:
            tag: "v3.3.3@sha256:73915f07e1f4289ba45b174c58443db74cef47ddf502613f475fc5e52458ea42"
  persistence:
    cache:
      type: emptyDir                # decision: model cache is ephemeral (re-downloaded on restart)
