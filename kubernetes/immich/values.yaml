# Chart immich/immich 0.12.0. The chart targets v2.6.3; images are overridden to the
# current release (v3.3.5). The database is plain YAML (database.yaml).
controllers:
  main:
    containers:
      main:
        env:
          REDIS_HOSTNAME: redis.databases
          REDIS_DBINDEX: "2"            # shared redis: db 0-1 = gramps
          DB_HOSTNAME: immich-database
          DB_USERNAME: user
          DB_DATABASE_NAME: db
          DB_PASSWORD:
            valueFrom:
              secretKeyRef: { name: immich, key: DB_PASSWORD }
          TZ: Europe/Paris
immich:
  persistence:
    library:
      existingClaim: library        # /data/immich/core
server:
  persistence:
    data:
      globalMounts:
        - path: /usr/src/app/upload   # same path as Docker (paths are stored in the database)
  controllers:
    main:
      containers:
        main:
          image:
            tag: "v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6"
machine-learning:
  controllers:
    main:
      containers:
        main:
          image:
            tag: "v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56"
  persistence:
    cache:
      type: emptyDir                # decision: model cache is ephemeral (re-downloaded on restart)
