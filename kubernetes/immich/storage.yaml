apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
spec:
  storageClassName: data
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  local: { path: /data/immich/core }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [nas] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library
  namespace: immich
spec:
  storageClassName: data
  volumeName: immich-library
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-database
spec:
  storageClassName: data
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  local: { path: /data/immich/db }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [nas] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database
  namespace: immich
spec:
  storageClassName: data
  volumeName: immich-database
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
