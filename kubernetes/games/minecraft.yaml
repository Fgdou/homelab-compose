# Scaled 0 <-> 1 by mc-router (mc-router.yaml), see SCALE-TO-ZERO.md.
# StatefulSet because mc-router only scales those; name and serviceName must both be "minecraft".
# No spec.replicas: mc-router owns it (games.yaml also ignores /spec/replicas).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
spec:
  serviceName: minecraft
  selector:
    matchLabels: { app.kubernetes.io/name: minecraft }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minecraft }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      terminationGracePeriodSeconds: 90   # mc-server-runner --stop-duration 60s; the default 30 s killed slow saves
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest@sha256:bb1cf73b342bdf6fa03b9d689b699bd1f8c6989f81ea07d520985eb2f18e6f30  # Paper 26.3 (VERSION env)
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          stdin: true
          tty: true
          env:
            - { name: EULA, value: "TRUE" }
            - { name: VERSION, value: "26.3" }
            - { name: TYPE, value: PAPER }
            - { name: MAX_MEMORY, value: 4G }
            - { name: STOP_SERVER_ANNOUNCE_DELAY, value: "0" }   # nobody is online at scale-down
            - { name: ENABLE_WHITELIST, value: "true" }
          ports:
            - { name: minecraft, containerPort: 25565 }
            - { name: bluemap, containerPort: 8123 }
          readinessProbe:                             # tells mc-router the backend is ready
            exec: { command: [mc-health] }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 2Gi }
            limits: { memory: 5Gi }                   # MAX_MEMORY 4G + JVM overhead
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: minecraft } }
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: games
  annotations:
    # default route only: mc-router 1.49 ignores defaultServer when externalServerName is set
    mc-router.itzg.me/defaultServer: "true"           # any hostname / plain IP is routed here
    mc-router.itzg.me/autoScaleWaitTimeout: "2m"      # longer than a cold start, so the scale-down timer is armed even if the client gave up
spec:
  type: ClusterIP                                 # players come through mc-router (LB 25566)
  selector: { app.kubernetes.io/name: minecraft }
  ports:
    - { name: minecraft, port: 25565, targetPort: 25565 }
---
# BlueMap plugin webserver, only used by bluemap-web for live/ (player positions) while the server runs
apiVersion: v1
kind: Service
metadata:
  name: bluemap-live
  namespace: games
spec:
  selector: { app.kubernetes.io/name: minecraft }
  ports:
    - { name: http, port: 8123, targetPort: 8123 }
