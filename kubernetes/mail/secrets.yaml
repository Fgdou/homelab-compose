# mailserver: RELAY_USER, RELAY_PASSWORD (were MAILJET_EMAIL, MAILJET_PASSWORD)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailserver
  namespace: mail
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: mailserver
  dataFrom:
    - extract:
        key: mail/mailserver
