apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: wordpress }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wordpress }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: wordpress
          image: wordpress:latest@sha256:0324d403512533271f85831518d0d8618ae794f8d50e40103cbac473119188af
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          env:
            - { name: WORDPRESS_DB_HOST, value: mysql }
            - { name: WORDPRESS_DB_USER, value: user }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: wordpress, key: WORDPRESS_DB_PASSWORD } }
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 128Mi }
          volumeMounts:
            - { name: html, mountPath: /var/www/html }
      volumes:
        - { name: html, persistentVolumeClaim: { claimName: wordpress } }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: ciq
spec:
  selector: { app.kubernetes.io/name: wordpress }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wordpress
  namespace: ciq
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ciq-panier.fr`)
      kind: Rule
      services: [{ name: wordpress, port: 80 }]
