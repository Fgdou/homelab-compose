# wordpress: WORDPRESS_DB_PASSWORD, MYSQL_PASSWORD ("password", kept as is — internal only)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wordpress
  namespace: ciq
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: wordpress
  dataFrom:
    - extract:
        key: ciq/wordpress
