apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: projects
resources:
  - storage.yaml
  - secrets.yaml
  - sr.yaml
  - mariage.yaml
  - todoapp.yaml
# mariage and todoapp follow their :latest tag (was watchtower). Argo CD Image Updater
# (platform/image-updater/image-updater.yaml) rewrites these digests in git when a new image is pushed.
images:
  - name: gitea.fgdou.ovh/fgdou/mariage
    newTag: latest
    digest: sha256:93e29936c4307d2ef2cdcd9079815e1b7a02283cf456852b536de81ca8444105
  - name: ghcr.io/fgdou/todoapp
    newTag: latest
    digest: sha256:25b6bc4f6df40318a0dda66be74e86407e36ed6b59efe7ac67d365b7e133d4ac
