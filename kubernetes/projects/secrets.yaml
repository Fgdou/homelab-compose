# todoapp: OIDC_CLIENT_SECRET (was TODO_OIDC_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: todoapp
  namespace: projects
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: todoapp
  dataFrom:
    - extract:
        key: projects/todoapp
