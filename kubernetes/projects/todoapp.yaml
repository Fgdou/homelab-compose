apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: todoapp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: todoapp }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: todoapp
          image: ghcr.io/fgdou/todoapp               # tag + digest set in kustomization.yaml
          env:
            - { name: OIDC_ENABLED, value: "true" }
            - { name: OIDC_CLIENT_ID, value: Tz5dISJ5KtrZJl956VjPNPdk4KhShvSRxD72PJ07 }
            - { name: OIDC_CONFIGURATION_URI, value: https://auth.fgdou.ovh/application/o/todo-test/.well-known/openid-configuration }
            - { name: OIDC_REDIRECT_URI, value: https://todo.fgdou.ovh/auth/oidc/redirect }
          envFrom:
            - secretRef: { name: todoapp }
          ports: [{ name: http, containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 64Mi }
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - { name: data, emptyDir: {} }             # decision: todoapp data is disposable
---
apiVersion: v1
kind: Service
metadata:
  name: todoapp
  namespace: projects
spec:
  selector: { app.kubernetes.io/name: todoapp }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: todoapp
  namespace: projects
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`todo.fgdou.ovh`)
      kind: Rule
      services: [{ name: todoapp, port: 80 }]
