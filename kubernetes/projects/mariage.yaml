apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariage
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mariage }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mariage }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: mariage
          image: gitea.fgdou.ovh/fgdou/mariage      # tag + digest set in kustomization.yaml
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mariage
  namespace: projects
spec:
  selector: { app.kubernetes.io/name: mariage }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mariage
  namespace: projects
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`mariage.fgdou.ovh`)
      kind: Rule
      services: [{ name: mariage, port: 80 }]
