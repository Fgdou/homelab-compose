apiVersion: apps/v1
kind: Deployment
metadata:
  name: sr
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: sr }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sr }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: sr
          image: ghcr.io/fgdou/sr_project:master@sha256:91a9a5da92f035b05f1dd1acab1bcc377fe839b8982c234a4a04b961a9fcc350
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          volumeMounts:
            - { name: data, mountPath: /app/leaderboard, subPath: leaderboard }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: sr } }
---
apiVersion: v1
kind: Service
metadata:
  name: sr
  namespace: projects
spec:
  selector: { app.kubernetes.io/name: sr }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sr
  namespace: projects
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`sr.fgdou.ovh`)
      kind: Rule
      services: [{ name: sr, port: 80 }]
