# authentik: AUTHENTIK_SECRET_KEY, AUTHENTIK_POSTGRESQL__PASSWORD, AUTHENTIK_EMAIL__* (was env_file .env)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
  namespace: authentik
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: authentik
  dataFrom:
    - extract:
        key: authentik/authentik
# authentik-ldap: AUTHENTIK_TOKEN (was AUTHENTIK_LDAP_TOKEN)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-ldap
  namespace: authentik
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: authentik-ldap
  dataFrom:
    - extract:
        key: authentik/authentik-ldap
