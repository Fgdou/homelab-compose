# Argo CD OIDC login (configs.cm oidc.config in platform/argocd/values.yaml). Applied by hand in `ak shell`
# (ak apply_blueprint only accepts files under /blueprints), see README.md "OpenBao login" for the command.
# The client secret is generated by authentik and stored in OpenBao kv/argocd/argocd-oidc (never committed).
# Only the "admin" group can use the application; Argo CD RBAC maps the "admin" group to role:admin.
version: 1
metadata:
  name: Argo CD OIDC
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Argo CD
    attrs:
      client_type: confidential
      client_id: argocd
      grant_types: [authorization_code]   # new providers default to [] = every grant refused ("Invalid grant_type")
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      include_claims_in_id_token: true    # Argo CD reads "groups" from the ID token
      redirect_uris:
        - matching_mode: strict
          url: https://argocd.fgdou.ovh/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: app
    identifiers:
      slug: argocd
    attrs:
      name: Argo CD
      provider: !KeyOf provider
      meta_launch_url: https://argocd.fgdou.ovh/
      open_in_new_tab: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, admin]]
    attrs:
      order: 0
