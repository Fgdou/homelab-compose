# OpenBao OIDC login (auth/oidc in OpenBao). Applied by hand:
#   docker exec -i authentik_server sh -c 'cat > /tmp/openbao.yaml' < authentik/blueprints/openbao.yaml
#   docker exec authentik_server ak apply_blueprint /tmp/openbao.yaml
# The client secret is generated by authentik on creation and copied into OpenBao (never committed).
# Only the "admin" group can use the application; in OpenBao, the external group "admin" gets the admin policy.
version: 1
metadata:
  name: OpenBao OIDC
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: OpenBao
    attrs:
      client_type: confidential
      client_id: openbao
      grant_types: [authorization_code]   # new providers default to [] = every grant refused ("Invalid grant_type")
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      redirect_uris:
        - matching_mode: strict
          url: https://bao.fgdou.ovh/ui/vault/auth/oidc/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: app
    identifiers:
      slug: openbao
    attrs:
      name: OpenBao
      provider: !KeyOf provider
      meta_launch_url: https://bao.fgdou.ovh/
      open_in_new_tab: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, admin]]
    attrs:
      order: 0
