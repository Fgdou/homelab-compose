# Replaces authentik@docker. Used from every namespace: { name: authentik, namespace: authentik }
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: authentik
spec:
  forwardAuth:
    # INTERIM: authentik still runs on Docker, published on 10.0.0.2:9000 (/data/compose/authentik.yml).
    # When authentik moves to k3s: switch back to http://authentik-server.authentik/outpost.goauthentik.io/auth/traefik
    # and remove the ports: entry from authentik.yml.
    address: http://10.0.0.2:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
