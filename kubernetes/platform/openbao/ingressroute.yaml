# UI behind authentik. If authentik is down: kubectl -n openbao port-forward svc/openbao 8200
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao
  namespace: openbao
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`bao.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: authentik, namespace: authentik }]
      services: [{ name: openbao, port: 8200 }]
