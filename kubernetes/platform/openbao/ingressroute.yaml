# UI login: OpenBao's own OIDC auth method with authentik (authentik/blueprints/openbao.yaml), so no forward-auth.
# LAN-only: lan-only Middleware (cluster/base/lan-only.yaml).
# If authentik is down: kubectl -n openbao port-forward svc/openbao 8200, and `bao operator generate-root`.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao
  namespace: openbao
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`bao.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: lan-only, namespace: kube-system }]
      services: [{ name: openbao, port: 8200 }]
