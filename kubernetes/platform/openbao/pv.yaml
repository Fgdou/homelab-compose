apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-data
spec:
  storageClassName: data
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  claimRef: { namespace: openbao, name: data-openbao-0 }   # PVC created by the chart's StatefulSet
  local: { path: /data/openbao }                           # create the folder before installing
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [nas] }
