# Client secret of the authentik "Argo CD" provider (authentik/blueprints/argocd.yaml), referenced in
# values.yaml as $argocd-oidc:clientSecret. Argo CD only reads Secrets labelled part-of: argocd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef: { key: argocd/argocd-oidc, property: clientSecret }
