# Chart argo/argo-cd 10.10.5 (Argo CD v3.5.5)
configs:
  params:
    server.insecure: true          # TLS is terminated by Traefik
  cm:
    url: https://argocd.fgdou.ovh
    exec.enabled: false
    admin.enabled: false           # login via authentik OIDC only (verified 2026-10-20); break-glass in README.md
    oidc.config: |
      name: authentik
      issuer: https://auth.fgdou.ovh/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes: ["openid", "profile", "email"]
  rbac:
    policy.default: ""             # no access unless a rule below matches
    policy.csv: |
      g, admin, role:admin
    scopes: "[groups]"
  # The repository is public and read over HTTPS: no repository credentials.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1536Mi }     # §9: keep a big sync from starving the apps; 768Mi OOM-looped syncing ~27 apps at once (2026-10-29)
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
