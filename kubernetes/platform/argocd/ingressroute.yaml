# Login: Argo CD's own OIDC with authentik (authentik/blueprints/argocd.yaml), so no forward-auth.
# LAN-only: ipAllowList of the Docker Traefik bridge router until the Phase 4 cutover.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.fgdou.ovh`)
      kind: Rule
      services: [{ name: argocd-server, port: 80 }]
