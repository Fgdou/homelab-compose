# Login: Argo CD's own OIDC with authentik (authentik/blueprints/argocd.yaml), so no forward-auth.
# LAN-only: lan-only Middleware (cluster/base/lan-only.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: lan-only, namespace: kube-system }]
      services: [{ name: argocd-server, port: 80 }]
