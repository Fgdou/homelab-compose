# Upstream local-path-provisioner (k3s's bundled one is disabled in bootstrap/k3s-config.yaml),
# with one storage class per disk: data-dynamic → /data/k8s, films-dynamic → /films/k8s.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/rancher/local-path-provisioner//deploy?ref=v0.0.37
patches:
  - target: { kind: StorageClass, name: local-path }
    patch: |-
      $patch: delete
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
  - target: { kind: ConfigMap, name: local-path-config }
    patch: |-
      - op: replace
        path: /data/config.json
        value: |-
          {
            "nodePathMap": [],
            "storageClassConfigs": {
              "data-dynamic":  { "nodePathMap": [ { "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES", "paths": ["/data/k8s"] } ] },
              "films-dynamic": { "nodePathMap": [ { "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES", "paths": ["/films/k8s"] } ] }
            }
          }
