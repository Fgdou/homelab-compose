# restic: RESTIC_PASSWORD + the S3 key pair shared with monitoring/s3-exporter
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic
  namespace: infra
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target: { name: restic }
  dataFrom:
    - extract: { key: infra/restic }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: shared, property: S3_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: shared, property: S3_SECRET_ACCESS_KEY }
