# Replaces lobaro/restic-backup-docker (internal cron). Same repository, same host name and path,
# so snapshots continue the same series. Weekly, Sunday 02:00 UTC, keep the last 3.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic
spec:
  schedule: "0 2 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: nas }
          containers:
            - name: restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command: [/bin/sh, -c]
              args:
                - |
                  set -e
                  restic backup /data/Backup --host nasrestic
                  restic forget --host nasrestic --keep-last 3 --prune
              env:
                - { name: RESTIC_REPOSITORY, value: "s3:https://s3.gra.io.cloud.ovh.net/fgdou-nas-backup" }
                - { name: RESTIC_CACHE_DIR, value: /cache }
              envFrom:
                - secretRef: { name: restic }
              securityContext:
                runAsUser: 0                   # read every file under /data
              resources:
                requests: { cpu: 100m, memory: 256Mi }
              volumeMounts:
                - { name: data, mountPath: /data/Backup, readOnly: true }
                - { name: cache, mountPath: /cache }
          volumes:
            - { name: data, hostPath: { path: /data, type: Directory } }
            - { name: cache, emptyDir: {} }
