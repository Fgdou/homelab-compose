apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddclient
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: ddclient }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ddclient }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: ddclient
          image: lscr.io/linuxserver/ddclient:v4.0.0-ls238@sha256:8daff71cbdc8ef9b9e2db35617dcff250f3f219fe3f8110940107ceed0f9eb7b
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: Europe/Paris }
          resources:
            requests: { cpu: 5m, memory: 32Mi }
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - { name: config, persistentVolumeClaim: { claimName: ddclient } }
