# DATABASE_PASSWORD + POSTGRES_PASSWORD ("password", kept), SECRET_KEY_BASE (copy from the running
# dawarich_app container: it is NOT in .env), OIDC_CLIENT_SECRET (was DAWARICH_OIDC_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich
  namespace: dawarich
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: dawarich
  dataFrom:
    - extract:
        key: dawarich/dawarich
