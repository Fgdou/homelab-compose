apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-app
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: dawarich-app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dawarich-app }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: app
          image: freikin/dawarich:1.16.0@sha256:b533e6eac4464d55479d030229cf9487f338972cdb88924e8060ca759d0e28b8
          command: [web-entrypoint.sh]
          args: [bin/rails, server, -p, "3000", -b, "::"]
          stdin: true
          tty: true
          env:
            - { name: APPLICATION_HOSTS, value: "localhost,::1,127.0.0.1,dawarich.fgdou.ovh,auth.fgdou.ovh" }
            - { name: PROMETHEUS_EXPORTER_HOST, value: 0.0.0.0 }
            - { name: OIDC_PROVIDER_NAME, value: Authentik }
          envFrom:
            - configMapRef: { name: dawarich-env }
            - secretRef: { name: dawarich }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 3000 }
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 500m, memory: 4Gi }      # same limits as compose
          volumeMounts:
            - { name: data, mountPath: /var/app/public, subPath: public }
            - { name: data, mountPath: /var/app/tmp/imports/watched, subPath: watched }
            - { name: data, mountPath: /var/app/storage, subPath: storage }
            - { name: data, mountPath: /dawarich_db_data, subPath: db_data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: data } }
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich-app
  namespace: dawarich
spec:
  selector: { app.kubernetes.io/name: dawarich-app }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dawarich
  namespace: dawarich
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`dawarich.fgdou.ovh`)
      kind: Rule
      services: [{ name: dawarich-app, port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-sidekiq
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: dawarich-sidekiq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dawarich-sidekiq }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: sidekiq
          image: freikin/dawarich:1.16.0@sha256:b533e6eac4464d55479d030229cf9487f338972cdb88924e8060ca759d0e28b8
          command: [sidekiq-entrypoint.sh]
          args: [sidekiq]
          stdin: true
          tty: true
          env:
            - { name: APPLICATION_HOSTS, value: "localhost,::1,127.0.0.1,dawarich-app,dawarich.fgdou.ovh,auth.fgdou.ovh" }
            - { name: BACKGROUND_PROCESSING_CONCURRENCY, value: "4" }   # was 10, one user (RAM-USAGE.md)
            - { name: PROMETHEUS_EXPORTER_HOST, value: dawarich-app }
          envFrom:
            - configMapRef: { name: dawarich-env }
            - secretRef: { name: dawarich }
          resources:
            requests: { cpu: 50m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/app/public, subPath: public }
            - { name: data, mountPath: /var/app/tmp/imports/watched, subPath: watched }
            - { name: data, mountPath: /var/app/storage, subPath: storage }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: data } }
