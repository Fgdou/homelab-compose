# nextcloud: POSTGRES_PASSWORD (was NEXTCLOUD_DB_PASSWORD)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: nextcloud
  dataFrom:
    - extract:
        key: nextcloud/nextcloud
