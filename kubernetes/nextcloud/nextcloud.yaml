apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: nextcloud }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nextcloud }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: nextcloud
          image: nextcloud:34.0.5@sha256:9dbdc711cef21e1767a6e45a97e318e654d9e2ab2c1f1c570bb9cafc94529a18
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          # Same as compose: wait for authentik (OIDC) before starting apache.
          # Goes through the image's entrypoint so a new image version rsyncs the code
          # into /var/www/html and runs `occ upgrade` (data/, config/, custom_apps/ kept).
          command: [/bin/sh, -c]
          args:
            - |
              # Built-in Collabora (richdocumentscode) has no config hook: make proxy.php start coolwsd
              # with 1 pre-spawned kit instead of 4 (~340 MiB each). Re-applied after app updates.
              f=/var/www/html/custom_apps/richdocumentscode/proxy.php;
              if [ -f $f ] && ! grep -q num_prespawn_children $f; then
                sed -i 's|^\( *\)\$options\[\] = "--pidfile=|\1$options[] = "--o:num_prespawn_children=1";\n&|' $f;
              fi;
              until curl -fsS https://auth.fgdou.ovh/-/health/ready/; do
                echo "Waiting for oauth2..."; sleep 5;
              done;
              exec /entrypoint.sh apache2-foreground
          env:
            - { name: APACHE_DISABLE_REWRITE_IP, value: "true" }
            - { name: TRUSTED_PROXIES, value: "10.0.0.0/8 172.16.0.0/8" }
            - { name: OVERWRITEHOST, value: nextcloud.fgdou.ovh }
            - { name: OVERWRITEPROTOCOL, value: https }
            - { name: POSTGRES_DB, value: nextcloud }
            - { name: POSTGRES_USER, value: nextcloud }
            - { name: POSTGRES_HOST, value: postgres.databases }
            # No REDIS_HOST: the image's config/redis.config.php would replace the whole
            # `redis` array of config.php (host redis.databases, dbindex 7) and drop dbindex.
            - { name: PHP_MEMORY_LIMIT, value: 1024M }
            - { name: PHP_UPLOAD_LIMIT, value: 1024M }
          envFrom:
            - secretRef: { name: nextcloud }
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /status.php, port: 80 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
          volumeMounts:
            - { name: code, mountPath: /var/www/html }
        # Background jobs (mode "cron"): replaces the host crontab entry
        # `docker compose -f nextcloud.yml exec -u www-data nextcloud php cron.php`.
        # /cron.sh is the image's busybox crond running cron.php as www-data every 5 min.
        - name: cron
          image: nextcloud:34.0.5@sha256:9dbdc711cef21e1767a6e45a97e318e654d9e2ab2c1f1c570bb9cafc94529a18
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          command: [/cron.sh]
          env:
            - { name: TRUSTED_PROXIES, value: "10.0.0.0/8 172.16.0.0/8" }
            - { name: OVERWRITEHOST, value: nextcloud.fgdou.ovh }
            - { name: OVERWRITEPROTOCOL, value: https }
            - { name: PHP_MEMORY_LIMIT, value: 1024M }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
          volumeMounts:
            - { name: code, mountPath: /var/www/html }
      volumes:
        - { name: code, persistentVolumeClaim: { claimName: code } }
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  selector: { app.kubernetes.io/name: nextcloud }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`nextcloud.fgdou.ovh`)
      kind: Rule
      services: [{ name: nextcloud, port: 80 }]
