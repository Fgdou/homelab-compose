apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: ntfy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ntfy }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.32.0@sha256:59250e1d8be2ee2186c4560322f625faef22ace380331f05b63f8842dbd62602
          args: [serve]
          env:
            - { name: NTFY_BASE_URL, value: https://ntfy.fgdou.ovh }
            - { name: NTFY_BEHIND_PROXY, value: "true" }
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /v1/health, port: 80 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          volumeMounts:
            - { name: data, mountPath: /etc/ntfy }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ntfy }
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: monitoring
spec:
  selector: { app.kubernetes.io/name: ntfy }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ntfy
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ntfy.fgdou.ovh`)
      kind: Rule
      services: [{ name: ntfy, port: 80 }]
