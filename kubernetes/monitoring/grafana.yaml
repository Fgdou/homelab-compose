apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
          env:
            - { name: GF_SERVER_ROOT_URL, value: https://grafana.fgdou.ovh/ }
            - { name: GF_AUTH_GENERIC_OAUTH_ENABLED, value: "true" }
            - { name: GF_AUTH_GENERIC_OAUTH_NAME, value: authentik }
            - { name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID, value: 5Geuv1IQuwh222mjR9pHNTh70LK8InMLIwKasVCH }
            - { name: GF_AUTH_GENERIC_OAUTH_SCOPES, value: openid profile email }
            - { name: GF_AUTH_GENERIC_OAUTH_AUTH_URL, value: https://auth.fgdou.ovh/application/o/authorize/ }
            - { name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL, value: https://auth.fgdou.ovh/application/o/token/ }
            - { name: GF_AUTH_GENERIC_OAUTH_API_URL, value: https://auth.fgdou.ovh/application/o/userinfo/ }
            - { name: GF_AUTH_SIGNOUT_REDIRECT_URL, value: https://auth.fgdou.ovh/application/o/grafana/end-session/ }
            - { name: GF_AUTH_OAUTH_AUTO_LOGIN, value: "true" }
            - { name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH, value: "contains(groups, 'admin') && 'Admin' || 'Viewer'" }
            - { name: GF_SMTP_ENABLED, value: "true" }
            - { name: GF_SMTP_HOST, value: "mail.fgdou.ovh:465" }
            - { name: GF_SMTP_USER, value: no-reply@fgdou.ovh }
            - { name: GF_SMTP_FROM_ADDRESS, value: no-reply@fgdou.ovh }
            - { name: GF_SMTP_FROM_NAME, value: Grafana }
          envFrom:
            - secretRef: { name: grafana }
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 20m, memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`grafana.fgdou.ovh`)
      kind: Rule
      services: [{ name: grafana, port: 3000 }]
