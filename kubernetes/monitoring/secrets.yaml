# grafana: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (+ SMTP_PASSWORD shared)
# jellyfin-exporter: JELLYFIN_EXPORTER_API_KEY
# postgres-exporter: POSTGRES_ADMIN_PASSWORD (shared)
# s3-exporter: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (shared with infra/restic)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
  namespace: monitoring
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target: { name: grafana }
  dataFrom:
    - extract: { key: monitoring/grafana }
  data:
    - secretKey: GF_SMTP_PASSWORD
      remoteRef: { key: shared, property: SMTP_PASSWORD }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-exporter
  namespace: monitoring
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target: { name: jellyfin-exporter }
  dataFrom:
    - extract: { key: monitoring/jellyfin-exporter }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target: { name: postgres-exporter }
  data:
    - secretKey: DATA_SOURCE_PASS
      remoteRef: { key: shared, property: POSTGRES_ADMIN_PASSWORD }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3
  namespace: monitoring
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target: { name: s3 }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: shared, property: S3_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: shared, property: S3_SECRET_ACCESS_KEY }
