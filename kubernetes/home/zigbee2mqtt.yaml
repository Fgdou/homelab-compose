apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: zigbee2mqtt }
  template:
    metadata:
      labels: { app.kubernetes.io/name: zigbee2mqtt }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      nodeSelector: { kubernetes.io/hostname: nas }   # USB dongle
      containers:
        - name: zigbee2mqtt
          image: ghcr.io/koenkk/zigbee2mqtt:2.14.2   # TODO digest
          env:
            - { name: TZ, value: Europe/Paris }
          securityContext:
            privileged: true             # access to /dev/ttyACM0
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /app/data, subPath: zigbee2mqtt }
            - { name: udev, mountPath: /run/udev, readOnly: true }
            - { name: dongle, mountPath: /dev/ttyACM0 }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: homeassistant } }
        - { name: udev, hostPath: { path: /run/udev } }
        - { name: dongle, hostPath: { path: /dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2440702-if00, type: CharDevice } }  # stable name, even if it re-enumerates as ttyACMn
---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  namespace: home
spec:
  selector: { app.kubernetes.io/name: zigbee2mqtt }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zigbee2mqtt
  namespace: home
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`zigbee2mqtt.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: authentik, namespace: authentik }]
      services: [{ name: zigbee2mqtt, port: 8080 }]
