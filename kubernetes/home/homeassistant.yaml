apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: homeassistant }
  template:
    metadata:
      labels: { app.kubernetes.io/name: homeassistant }
    spec:
      # hostNetwork for discovery (mDNS, HomeKit 21063, Roborock 58866-58867); still resolves cluster names
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
          env:
            - { name: TZ, value: Europe/Paris }
          securityContext:
            privileged: true
            runAsUser: 0                 # was user: root:users
            runAsGroup: 100
          ports: [{ name: http, containerPort: 8123 }]
          resources:
            requests: { cpu: 100m, memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /config, subPath: core }
            - { name: data, mountPath: /media, subPath: media }
            - { name: dbus, mountPath: /run/dbus }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: homeassistant } }
        - { name: dbus, hostPath: { path: /run/dbus, type: Directory } }
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: home
spec:
  selector: { app.kubernetes.io/name: homeassistant }
  ports:
    - { name: http, port: 8123, targetPort: 8123 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant
  namespace: home
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`dash.fgdou.ovh`)
      kind: Rule
      services: [{ name: homeassistant, port: 8123 }]
