apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: mosquitto }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mosquitto }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
          ports: [{ name: mqtt, containerPort: 1883 }]
          readinessProbe:
            tcpSocket: { port: 1883 }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
          volumeMounts:
            - { name: data, mountPath: /mosquitto/config, subPath: mosquitto/config }   # holds the password file
            - { name: data, mountPath: /mosquitto/data, subPath: mosquitto/data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: homeassistant } }
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: home
spec:
  selector: { app.kubernetes.io/name: mosquitto }
  ports:
    - { name: mqtt, port: 1883 }
