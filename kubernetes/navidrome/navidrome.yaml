apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: navidrome }
  template:
    metadata:
      labels: { app.kubernetes.io/name: navidrome }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      securityContext: { runAsUser: 1000, runAsGroup: 1000 }
      containers:
        - name: navidrome
          image: deluan/navidrome:0.58.5@sha256:648ebd45c50c58edc7ad9f0cc3b4411a1bece16c81f0b3630a0ab0a739c6d7ec
          env:
            - { name: ND_REVERSEPROXYWHITELIST, value: 0.0.0.0/0 }
            - { name: ND_REVERSEPROXYUSERHEADER, value: X-authentik-username }
            - { name: ND_ENABLESHARING, value: true }
          ports: [{ name: http, containerPort: 4533 }]
          readinessProbe:
            httpGet: { path: /ping, port: 4533 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: music, mountPath: /music, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data }
        - name: music
          persistentVolumeClaim: { claimName: music }
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: navidrome
spec:
  selector: { app.kubernetes.io/name: navidrome }
  ports:
    - { name: http, port: 4533, targetPort: 4533 }
---
# Two routes: Subsonic API and shares bypass authentik, the rest goes through it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: navidrome
  namespace: navidrome
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`music.fgdou.ovh`) && !(PathPrefix(`/share/`) || PathPrefix(`/rest/`))
      kind: Rule
      middlewares: [{ name: authentik, namespace: authentik }]
      services: [{ name: navidrome, port: 4533 }]
    - match: Host(`music.fgdou.ovh`) && (PathPrefix(`/share`) || PathPrefix(`/rest`))
      kind: Rule
      services: [{ name: navidrome, port: 4533 }]
