# Needs cert-manager + the cloudflare Secret (cluster-secret-store)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-certs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fgdou/homelab-compose.git
    targetRevision: main
    path: kubernetes/cluster/certs
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # since 2026-10-20 (adoption verified)
