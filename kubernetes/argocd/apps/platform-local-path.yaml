apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-local-path
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fgdou/homelab-compose.git
    targetRevision: kube
    path: kubernetes/platform/local-path
  destination: { server: https://kubernetes.default.svc, namespace: local-path-storage }
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # since 2026-10-20 (adoption verified)
