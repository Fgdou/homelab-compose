# Namespaces, storage classes, Traefik configuration
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fgdou/homelab-compose.git
    targetRevision: kube
    path: kubernetes/cluster/base
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # since 2026-10-20 (adoption verified)
