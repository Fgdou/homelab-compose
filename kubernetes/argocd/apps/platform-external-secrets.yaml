apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.13.0
      helm:
        releaseName: external-secrets
        valueFiles: [$values/kubernetes/platform/external-secrets/values.yaml]
    - repoURL: https://github.com/Fgdou/homelab-compose.git
      targetRevision: kube
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  syncPolicy:
    syncOptions: [ServerSideApply=true]
    # Manual sync first; once verified, add:
    # automated: { prune: false, selfHeal: true }
