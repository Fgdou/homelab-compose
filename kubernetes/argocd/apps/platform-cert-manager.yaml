apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        releaseName: cert-manager
        valueFiles: [$values/kubernetes/platform/cert-manager/values.yaml]
    - repoURL: https://github.com/Fgdou/homelab-compose.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: cert-manager }
  syncPolicy:
    syncOptions: [ServerSideApply=true]
    automated: { prune: false, selfHeal: true }   # since 2026-10-20 (adoption verified)
