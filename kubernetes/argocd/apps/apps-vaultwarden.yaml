apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-vaultwarden
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fgdou/homelab-compose.git
    targetRevision: main
    path: kubernetes/apps/vaultwarden
  destination: { server: https://kubernetes.default.svc, namespace: apps }
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # since 2026-10-21 (app verified)
