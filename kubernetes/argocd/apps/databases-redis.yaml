apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databases-redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fgdou/homelab-compose.git
    targetRevision: main
    path: kubernetes/databases/redis
  destination: { server: https://kubernetes.default.svc, namespace: databases }
  # Manual sync first; once verified, uncomment (MIGRATION.md §8):
  # syncPolicy:
  #   automated: { prune: false, selfHeal: true }
