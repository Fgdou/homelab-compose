# Needs External Secrets + an unsealed OpenBao
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secret-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fgdou/homelab-compose.git
    targetRevision: kube
    path: kubernetes/cluster/secret-store
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # since 2026-10-20 (adoption verified)
