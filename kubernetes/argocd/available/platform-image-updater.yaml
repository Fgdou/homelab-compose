apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-image-updater
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.3.2
      helm:
        releaseName: argocd-image-updater
        valueFiles: [$values/kubernetes/platform/image-updater/values.yaml]
    - repoURL: git@github.com:Fgdou/homelab-compose.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:Fgdou/homelab-compose.git
      targetRevision: main
      path: kubernetes/platform/image-updater
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    syncOptions: [ServerSideApply=true]
    # Manual sync first; once verified, add:
    # automated: { prune: false, selfHeal: true }
