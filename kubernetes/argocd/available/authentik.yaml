apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.4
      helm:
        releaseName: authentik
        valueFiles: [$values/kubernetes/authentik/values.yaml]
    - repoURL: git@github.com:Fgdou/homelab-compose.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:Fgdou/homelab-compose.git
      targetRevision: main
      path: kubernetes/authentik
  destination: { server: https://kubernetes.default.svc, namespace: authentik }
  syncPolicy:
    syncOptions: [ServerSideApply=true]
    # Manual sync first; once verified, add:
    # automated: { prune: false, selfHeal: true }
