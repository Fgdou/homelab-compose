apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://immich-app.github.io/immich-charts
      chart: immich
      targetRevision: 0.12.0
      helm:
        releaseName: immich
        valueFiles: [$values/kubernetes/immich/values.yaml]
    - repoURL: https://github.com/Fgdou/homelab-compose.git
      targetRevision: kube
      ref: values
    - repoURL: https://github.com/Fgdou/homelab-compose.git
      targetRevision: kube
      path: kubernetes/immich
  destination: { server: https://kubernetes.default.svc, namespace: immich }
  syncPolicy:
    syncOptions: [ServerSideApply=true]
    # Manual sync first; once verified, add:
    # automated: { prune: false, selfHeal: true }
