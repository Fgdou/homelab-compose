apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Fgdou/homelab-compose.git
    targetRevision: main
    path: kubernetes/apps
  destination: { server: https://kubernetes.default.svc, namespace: apps }
  # Manual sync first; once the stack is verified, uncomment (MIGRATION.md §8):
  # syncPolicy:
  #   automated: { prune: false, selfHeal: true }
