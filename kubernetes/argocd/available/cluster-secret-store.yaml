# Needs External Secrets + an unsealed OpenBao
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secret-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Fgdou/homelab-compose.git
    targetRevision: main
    path: kubernetes/cluster/secret-store
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  # Manual sync first; once the stack is verified, uncomment (MIGRATION.md §8):
  # syncPolicy:
  #   automated: { prune: false, selfHeal: true }
