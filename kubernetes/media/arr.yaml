  template:
    metadata:
      labels: { app.kubernetes.io/name: lidarr }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: lidarr
          image: ghcr.io/hotio/lidarr:latest@sha256:226b11ba5b5c3bb8e59002f89f6671ba88758bd0d0d5f69badadb3ad45af7749  # 3.1.0.4875
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          env:
            - { name: PUID, value: "1000" }
