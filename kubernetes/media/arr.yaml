          volumeMounts:
            - { name: lidarr, mountPath: /config, subPath: config }
            - { name: lidarr, mountPath: /data, subPath: data }
            - { name: music, mountPath: /music }
            - { name: slskd, mountPath: /downloads, subPath: downloads }
      volumes:
        - { name: lidarr, persistentVolumeClaim: { claimName: lidarr } }
        - { name: music, persistentVolumeClaim: { claimName: music } }
