apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: radarr }
  template:
    metadata:
      labels: { app.kubernetes.io/name: radarr }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest@sha256:7dfd049e79c00b16fbc29c3f5d96a9e7b9e73a23930b4c5b3c4541d60b366814  # 6.4.4.10685-ls319
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          env:
            - { name: TZ, value: Europe/Paris }
          ports: [{ name: http, containerPort: 7878 }]
          readinessProbe:
            httpGet: { path: /ping, port: 7878 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: films, mountPath: /movies, subPath: films }
            - { name: films, mountPath: /downloads, subPath: Download }
      volumes:
        - { name: config, persistentVolumeClaim: { claimName: radarr } }
        - { name: films, persistentVolumeClaim: { claimName: films } }
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
spec:
  selector: { app.kubernetes.io/name: radarr }
  ports:
    - { name: http, port: 7878, targetPort: 7878 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
  namespace: media
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`radarr.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: authentik, namespace: authentik }]
      services: [{ name: radarr, port: 7878 }]
---
