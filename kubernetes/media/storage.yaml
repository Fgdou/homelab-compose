# Configs on /films are accepted as losable (MIGRATION.md §1).
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-lidarr
spec:
  storageClassName: data
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  local: { path: /data/lidarr }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [nas] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr
  namespace: media
spec:
  storageClassName: data
  volumeName: media-lidarr
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
