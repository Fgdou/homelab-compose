# slskd: SLSKD_SLSK_PASSWORD, SLSKD_API_KEY — musiseerr: LIDARR_API_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd
  namespace: media
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: slskd
  dataFrom:
    - extract:
        key: media/slskd
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: musiseerr
  namespace: media
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: musiseerr
  dataFrom:
    - extract:
        key: media/musiseerr
