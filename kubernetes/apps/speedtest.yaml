apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: speedtest }
  template:
    metadata:
      labels: { app.kubernetes.io/name: speedtest }
    spec:
      containers:
        - name: speedtest
          image: ghcr.io/librespeed/speedtest:5.4@sha256:0e0d9c8c2e5aa362164cf0bf25a48a606b5701f6bc7fa1695975b687aaec26a9  # 5.4.1
          env:
            - { name: MODE, value: standalone }
            - { name: TITLE, value: Fgdou Speedtest }
            - { name: WEBPORT, value: "8080" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: speedtest }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: speedtest
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`speedtest.fgdou.ovh`)
      kind: Rule
      services: [{ name: speedtest, port: 8080 }]
