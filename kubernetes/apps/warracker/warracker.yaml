apiVersion: apps/v1
kind: Deployment
metadata:
  name: warracker
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: warracker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: warracker }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: warracker
          image: ghcr.io/sassanix/warracker/main:1.0.6@sha256:8a59ead00c8c4c6df28c1ad3abd5d6de72cb2bab57f294413e1492f57672170c
          env:
            - { name: DB_HOST, value: postgres.databases }
            - { name: DB_NAME, value: warracker }
            - { name: DB_USER, value: warracker }
            - { name: FRONTEND_URL, value: https://warracker.fgdou.ovh }
            - { name: APP_BASE_URL, value: https://warracker.fgdou.ovh }
            - { name: WARRACKER_MEMORY_MODE, value: optimized }
            - { name: MAX_UPLOAD_MB, value: "16" }
            - { name: NGINX_MAX_BODY_SIZE_VALUE, value: 16M }
            - { name: OIDC_PROVIDER_NAME, value: oidc }
            - { name: OIDC_CLIENT_ID, value: qwsh6xqOHAbazotUTADmjqIhoH4ymUbFPGiJrAFi }
            - { name: OIDC_ISSUER_URL, value: https://auth.fgdou.ovh/application/o/warracker/ }
            - { name: OIDC_SCOPE, value: openid email profile }
            - { name: PYTHONUNBUFFERED, value: "1" }
          envFrom:
            - secretRef: { name: warracker }
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data/uploads, subPath: warracker_uploads }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: warracker } }
---
apiVersion: v1
kind: Service
metadata:
  name: warracker
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: warracker }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: warracker
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`warracker.fgdou.ovh`)
      kind: Rule
      services: [{ name: warracker, port: 80 }]
