# warracker: DB_PASSWORD, SECRET_KEY, OIDC_CLIENT_SECRET (were WARRACKER_DB_PASSWORD, WARRACKER_SECRET_KEY, WARRACKER_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warracker
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: warracker
  dataFrom:
    - extract:
        key: apps/warracker
