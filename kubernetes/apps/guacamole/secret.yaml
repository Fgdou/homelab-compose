# guacamole: POSTGRESQL_PASSWORD (was GUACAMOLE_DB_PASSWORD)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guacamole
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: guacamole
  dataFrom:
    - extract:
        key: apps/guacamole
