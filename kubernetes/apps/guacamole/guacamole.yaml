apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: guacd }
  template:
    metadata:
      labels: { app.kubernetes.io/name: guacd }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      securityContext: { runAsUser: 0, runAsGroup: 100 }   # was user: root:users
      containers:
        - name: guacd
          image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
          ports: [{ name: guacd, containerPort: 4822 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          volumeMounts:
            - { name: data, mountPath: /drive, subPath: drive }
            - { name: data, mountPath: /record, subPath: record }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: guacamole } }
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: guacd }
  ports:
    - { name: guacd, port: 4822 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: guacamole }
  template:
    metadata:
      labels: { app.kubernetes.io/name: guacamole }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      securityContext: { runAsUser: 0, runAsGroup: 100 }
      containers:
        - name: guacamole
          image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
          env:
            - { name: GUACD_HOSTNAME, value: guacd }
            - { name: POSTGRESQL_DATABASE, value: guacamole }
            - { name: POSTGRESQL_HOSTNAME, value: postgres.databases }
            - { name: POSTGRESQL_USER, value: guacamole }
            - { name: OPENID_ENABLED, value: "true" }
            - { name: OPENID_AUTHORIZATION_ENDPOINT, value: https://auth.fgdou.ovh/application/o/authorize/ }
            - { name: OPENID_CLIENT_ID, value: PaItAZvi1wxJuN1QVdhyxCM7xDaDIze6ZUp3Jr4D }
            - { name: OPENID_ISSUER, value: https://auth.fgdou.ovh/application/o/guacamole/ }
            - { name: OPENID_JWKS_ENDPOINT, value: https://auth.fgdou.ovh/application/o/guacamole/jwks/ }
            - { name: OPENID_REDIRECT_URI, value: https://guacamole.fgdou.ovh/guacamole/ }
            - { name: OPENID_USERNAME_CLAIM_TYPE, value: sub }
            - { name: EXTENSION_PRIORITY, value: openid }
          envFrom:
            - secretRef: { name: guacamole }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 20m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: guacamole }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guacamole
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`guacamole.fgdou.ovh`)
      kind: Rule
      services: [{ name: guacamole, port: 8080 }]
