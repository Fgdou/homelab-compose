# meshcentral: BACKUPS_PW (was ADMIN_PASSWORD)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meshcentral
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: meshcentral
  dataFrom:
    - extract:
        key: apps/meshcentral
