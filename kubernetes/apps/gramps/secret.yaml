# gramps: GRAMPSWEB_OIDC_CLIENT_SECRET, GRAMPSWEB_SECRET_KEY (were GRAMPS_OIDC_SECRET, GRAMPS_SECRET_KEY)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gramps
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: gramps
  dataFrom:
    - extract:
        key: apps/gramps
