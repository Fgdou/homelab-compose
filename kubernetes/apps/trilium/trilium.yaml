apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: trilium }
  template:
    metadata:
      labels: { app.kubernetes.io/name: trilium }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: trilium
          image: triliumnext/trilium:v0.102.2@sha256:f1a2fd88e7032d60f863231ce94348e906bcd6a5fa043801badd5896c20c064d
          env:
            - { name: TRILIUM_DATA_DIR, value: /home/node/trilium-data }
            - { name: TRILIUM_NETWORK_TRUSTEDREVERSEPROXY, value: 10.42.0.0/16 }   # was 172.18.0.0/16
            - { name: TRILIUM_GENERAL_NOAUTHENTICATION, value: "true" }
            - { name: TZ, value: Europe/Paris }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /api/health-check, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /home/node/trilium-data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: trilium } }
---
apiVersion: v1
kind: Service
metadata:
  name: trilium
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: trilium }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trilium
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`trilium.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: authentik, namespace: authentik }]
      services: [{ name: trilium, port: 8080 }]
