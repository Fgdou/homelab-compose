apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  selector:
    matchLabels: { app.kubernetes.io/name: speedtest }
  template:
    metadata:
      labels: { app.kubernetes.io/name: speedtest }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: speedtest
          image: ghcr.io/librespeed/speedtest:6.3.1@sha256:bc34bf69b6c102b23ab81b6e77beb7cce321fb0d3be33ec6e80edef3e9dd8bab
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          env:
            - { name: MODE, value: standalone }
            - { name: TITLE, value: Fgdou Speedtest }
            - { name: WEBPORT, value: "8080" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: speedtest }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: speedtest
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`speedtest.fgdou.ovh`)
      kind: Rule
      services: [{ name: speedtest, port: 8080 }]
