# openwebui: OAUTH_CLIENT_SECRET (was OPENWEBUI_SECRET)
# vaultwarden: ADMIN_TOKEN (was VAULTWARDEN_ADMIN_TOKEN)
# mealie: OIDC_CLIENT_SECRET (was AUTHENTIK_MEALIE_SECRET) + SMTP_PASSWORD (shared)
# meshcentral: BACKUPS_PW (was ADMIN_PASSWORD)
# warracker: DB_PASSWORD, SECRET_KEY, OIDC_CLIENT_SECRET (were WARRACKER_DB_PASSWORD, WARRACKER_SECRET_KEY, WARRACKER_SECRET)
# gramps: GRAMPSWEB_OIDC_CLIENT_SECRET, GRAMPSWEB_SECRET_KEY (were GRAMPS_OIDC_SECRET, GRAMPS_SECRET_KEY)
# guacamole: POSTGRESQL_PASSWORD (was GUACAMOLE_DB_PASSWORD)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: openwebui
  dataFrom:
    - extract:
        key: apps/openwebui
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: vaultwarden
  dataFrom:
    - extract:
        key: apps/vaultwarden
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: mealie
  dataFrom:
    - extract:
        key: apps/mealie
  data:
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: shared, property: SMTP_PASSWORD }
---
