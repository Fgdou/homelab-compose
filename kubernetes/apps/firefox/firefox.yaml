apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox
  labels: { sablier.enable: "true", sablier.group: firefox }   # Sablier scales 0 <-> 1, no replicas in git (SCALE-TO-ZERO-HTTP.md)
spec:
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  selector:
    matchLabels: { app.kubernetes.io/name: firefox }
  template:
    metadata:
      labels: { app.kubernetes.io/name: firefox }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: firefox
          image: lscr.io/linuxserver/firefox:latest@sha256:19dc07ce33ca47db941d00fa31671be89ceca5b958de5e9647f87184621cb41c  # 1158.0build2-1xtradeb1.2404.1-ls130
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 600Mi }
            limits: { memory: 3Gi }                   # includes the 1Gi /dev/shm below
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }   # was shm_size: 1gb
---
apiVersion: v1
kind: Service
metadata:
  name: firefox
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: firefox }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefox
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`firefox.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: authentik, namespace: authentik }, { name: firefox-sablier }]   # auth first: no wake-up for anonymous hits
      services: [{ name: firefox, port: 3000 }]
---
# Wakes firefox on the first request (waiting page), Sablier stops it after 30 min without requests
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: firefox-sablier
  namespace: apps
spec:
  plugin:
    sablier:
      sablierUrl: http://sablier.infra.svc.cluster.local:10000
      group: firefox
      sessionDuration: 30m
      keepAliveInterval: 5m           # the VNC websocket counts as activity while a tab is open
      dynamic: { displayName: Firefox, refreshFrequency: 5s }
