apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: firefox }
  template:
    metadata:
      labels: { app.kubernetes.io/name: firefox }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: firefox
          image: lscr.io/linuxserver/firefox:latest@sha256:19dc07ce33ca47db941d00fa31671be89ceca5b958de5e9647f87184621cb41c  # 1158.0build2-1xtradeb1.2404.1-ls130
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 20m, memory: 600Mi }
            limits: { memory: 3Gi }                   # includes the 1Gi /dev/shm below
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }   # was shm_size: 1gb
---
apiVersion: v1
kind: Service
metadata:
  name: firefox
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: firefox }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefox
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`firefox.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: authentik, namespace: authentik }]
      services: [{ name: firefox, port: 3000 }]
