# vaultwarden: ADMIN_TOKEN (was VAULTWARDEN_ADMIN_TOKEN)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: vaultwarden
  dataFrom:
    - extract:
        key: apps/vaultwarden
