# mealie: OIDC_CLIENT_SECRET (was AUTHENTIK_MEALIE_SECRET) + SMTP_PASSWORD (shared)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: mealie
  dataFrom:
    - extract:
        key: apps/mealie
  data:
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: shared, property: SMTP_PASSWORD }
