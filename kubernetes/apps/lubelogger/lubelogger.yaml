apiVersion: apps/v1
kind: Deployment
metadata:
  name: lubelogger
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: lubelogger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lubelogger }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: lubelogger
          image: ghcr.io/hargata/lubelogger:v1.7.4@sha256:483a9d7582c4e6258615fd822b3de4193b4fcc4230d0a92432c6d407faf75af2
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 96Mi }
          volumeMounts:
            - { name: data, mountPath: /App/data, subPath: data }
            - { name: data, mountPath: /root/.aspnet/DataProtection-Keys, subPath: keys }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: lubelogger } }
---
apiVersion: v1
kind: Service
metadata:
  name: lubelogger
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: lubelogger }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lubelogger
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`lubelogger.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: authentik, namespace: authentik }]
      services: [{ name: lubelogger, port: 8080 }]
