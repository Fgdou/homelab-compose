apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  labels: { sablier.enable: "true", sablier.group: openwebui }   # Sablier scales 0 <-> 1, no replicas in git (SCALE-TO-ZERO-HTTP.md)
spec:
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: openwebui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: openwebui }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:main@sha256:24669393b06bc05b5193b26ae59483b6d53e8b47a5a74217053373cef5e1ae7d
          env:
            - { name: WEBUI_URL, value: https://ai.fgdou.ovh }
            - { name: ENABLE_SIGNUP, value: "False" }
            - { name: ENABLE_LOGIN_FORM, value: "false" }
            - { name: OAUTH_CLIENT_ID, value: R1MSywhWWLqp6CvE3iskOMgnJBuZx0SOWTiBgYmH }
            - { name: OPENID_PROVIDER_URL, value: https://auth.fgdou.ovh/application/o/openwebui/.well-known/openid-configuration }
            - { name: ENABLE_OAUTH_ROLE_MANAGEMENT, value: "True" }
            - { name: ENABLE_OAUTH_SIGNUP, value: "True" }
            - { name: OAUTH_ROLES_CLAIM, value: groups }
          envFrom:
            - secretRef: { name: openwebui }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 700Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /app/backend/data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: openwebui } }
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: openwebui }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openwebui
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ai.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: openwebui-sablier }]
      services: [{ name: openwebui, port: 8080 }]
---
# Wakes openwebui on the first request (waiting page), Sablier stops it after 30 min without requests
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openwebui-sablier
  namespace: apps
spec:
  plugin:
    sablier:
      sablierUrl: http://sablier.infra.svc.cluster.local:10000
      group: openwebui
      sessionDuration: 30m
      dynamic: { displayName: Open WebUI, refreshFrequency: 5s }
