apiVersion: v1
kind: PersistentVolume
metadata:
  name: apps-openwebui
spec:
  storageClassName: films
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  local: { path: /films/openwebui }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [nas] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui
  namespace: apps
spec:
  storageClassName: films
  volumeName: apps-openwebui
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
