# openwebui: OAUTH_CLIENT_SECRET (was OPENWEBUI_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: openwebui
  dataFrom:
    - extract:
        key: apps/openwebui
