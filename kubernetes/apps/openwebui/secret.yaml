# openwebui: OAUTH_CLIENT_SECRET (was OPENWEBUI_SECRET), WEBUI_SECRET_KEY (copied 2026-10-20 from the container's generated /app/backend/.webui_secret_key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui
  namespace: apps
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: openwebui
  dataFrom:
    - extract:
        key: apps/openwebui
