apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: mealie }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mealie }
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.8.0@sha256:8cb354ce7b9e73304c0f3dedf13b7fe8ffe2f25775c9bbe79b5c446ef0334fd6
          env:
            - { name: ALLOW_SIGNUP, value: "false" }
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: Europe/Paris }
            - { name: MAX_WORKERS, value: "1" }
            - { name: WEB_CONCURRENCY, value: "1" }
            - { name: BASE_URL, value: https://mealie.fgdou.ovh }
            - { name: SMTP_HOST, value: mail.fgdou.ovh }
            - { name: SMTP_FROM_EMAIL, value: no-reply@fgdou.ovh }
            - { name: SMTP_USER, value: no-reply@fgdou.ovh }
            - { name: SMTP_AUTH_STRATEGY, value: TLS }
            - { name: OIDC_AUTH_ENABLED, value: "true" }
            - { name: OIDC_SIGNUP_ENABLED, value: "true" }
            - { name: OIDC_CONFIGURATION_URL, value: https://auth.fgdou.ovh/application/o/mealie/.well-known/openid-configuration }
            - { name: OIDC_CLIENT_ID, value: E9KSp7i2gahMqkkdvQalGBb8AWVZR5k26a9HNf5P }
            - { name: OIDC_AUTO_REDIRECT, value: "true" }
            - { name: OIDC_PROVIDER_NAME, value: Authentik }
            - { name: OIDC_ADMIN_GROUP, value: admin }
            - { name: OIDC_USER_CLAIM, value: sub }
          envFrom:
            - secretRef: { name: mealie }
          ports: [{ name: http, containerPort: 9000 }]
          resources:
            requests: { cpu: 10m, memory: 256Mi }
            limits: { memory: 1000M }                 # same as compose
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: mealie } }
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: mealie }
  ports:
    - { name: http, port: 9000, targetPort: 9000 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mealie
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`mealie.fgdou.ovh`)
      kind: Rule
      services: [{ name: mealie, port: 9000 }]
