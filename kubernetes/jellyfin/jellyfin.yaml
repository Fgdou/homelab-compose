apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: jellyfin }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jellyfin }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      securityContext:
        supplementalGroups: [105]       # host "render" group → /dev/dri/renderD128 (VAAPI)
      containers:
        - name: jellyfin
          image: ghcr.io/linuxserver/jellyfin:10.11.6@sha256:aae645d1ff11c42b1d2d3b80694e34e0e1ea4a51879900843c8ab6e8b127a32a  # 10.11.6ubu2404-ls23
          env:
            - { name: TZ, value: Europe/Paris }
          ports: [{ name: http, containerPort: 8096 }]
          resources:
            requests: { cpu: 200m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: config, mountPath: /usr/share/jellyfin/web/config.json, subPath: config.json }
            - { name: films, mountPath: /data/movies }
            - { name: render, mountPath: /dev/dri/renderD128 }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: config }
        - name: films
          persistentVolumeClaim: { claimName: films }
        - name: render
          hostPath: { path: /dev/dri/renderD128, type: CharDevice }
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  selector: { app.kubernetes.io/name: jellyfin }
  ports:
    - { name: http, port: 8096, targetPort: 8096 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`films.fgdou.ovh`)
      kind: Rule
      services: [{ name: jellyfin, port: 8096 }]
