# Was published on host port 8080 without auth: now behind authentik only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: databases
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: adminer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: adminer }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: adminer
          image: adminer:latest@sha256:49a7d30e71de97fb18933ffe7d46cc2b343c49fd7a63a7791c8be2548eb65115
          imagePullPolicy: IfNotPresent   # digest-pinned: no registry/DNS needed at boot
          env:
            - { name: ADMINER_DEFAULT_SERVER, value: postgres }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: databases
spec:
  selector: { app.kubernetes.io/name: adminer }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adminer
  namespace: databases
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`adminer.fgdou.ovh`)
      kind: Rule
      middlewares: [{ name: authentik, namespace: authentik }]
      services: [{ name: adminer, port: 8080 }]
