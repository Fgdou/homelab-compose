# POSTGRES_ADMIN_PASSWORD is shared (kv/shared) with monitoring/postgres-exporter
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
  namespace: databases
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: postgres
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: shared, property: POSTGRES_ADMIN_PASSWORD }
