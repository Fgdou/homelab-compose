apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollout undo (rollback = git revert here)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: gitea }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gitea }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      containers:
        - name: gitea
          image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
          env:
            - { name: USER_UID, value: "1000" }
            - { name: USER_GID, value: "1000" }
            - { name: TZ, value: Europe/Paris }
          ports:
            - { name: http, containerPort: 3000 }
            - { name: ssh, containerPort: 22 }
          readinessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: data } }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector: { app.kubernetes.io/name: gitea }
  ports:
    - { name: http, port: 3000 }
    - { name: ssh, port: 22 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`gitea.fgdou.ovh`)
      kind: Rule
      services: [{ name: gitea, port: 3000 }]
---
# git over SSH through Traefik's ssh entrypoint (was traefik.tcp.routers.gitea, HostSNI(`*`))
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gitea-ssh
  namespace: gitea
spec:
  entryPoints: [ssh]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: gitea, port: 22 }]
