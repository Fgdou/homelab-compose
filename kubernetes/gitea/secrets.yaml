# gitea-runner: GITEA_RUNNER_REGISTRATION_TOKEN (was GITEA_REGISTRATION_TOKEN)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner
  namespace: gitea
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  refreshInterval: 1h
  target:
    name: gitea-runner
  dataFrom:
    - extract:
        key: gitea/gitea-runner
