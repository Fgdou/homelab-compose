apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: gitea-runner }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gitea-runner }
    spec:
      enableServiceLinks: false   # no <SERVICE>_PORT/_HOST env vars (README: service links trap)
      # act_runner + docker-in-docker sidecar (decision): workflows keep using docker.
      # No volume for the runner state: it re-registers at each start, like today.
      initContainers:
        # Native sidecar (restartPolicy: Always): starts first, the runner waits for its startupProbe.
        - name: dind
          image: docker:29.9.1-dind@sha256:3e5756e2b6dad6a5f1f5deacf0a19f9eaa2581b76ae092b2d4a118162e1d4d4e
          restartPolicy: Always
          # Unix socket only, on an emptyDir shared with the runner at the same path: act_runner mounts it
          # into job containers (docker/build-push-action needs it), as it did with the host socket.
          # args start with "dockerd": otherwise the entrypoint adds --host=tcp://0.0.0.0:2375 (whole cluster).
          args: [dockerd, --host=unix:///run/dind/docker.sock]
          startupProbe:
            exec: { command: [docker, -H, "unix:///run/dind/docker.sock", version] }
            periodSeconds: 2
            failureThreshold: 60
          securityContext:
            privileged: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          volumeMounts:
            - { name: docker, mountPath: /var/lib/docker }
            - { name: dind-sock, mountPath: /run/dind }
      containers:
        - name: runner
          image: gitea/act_runner:nightly@sha256:7940221bcfc9df16f3401ddafb2231bf98bba5517bc381224c7a2c504b558974
          env:
            - { name: GITEA_INSTANCE_URL, value: "https://gitea.fgdou.ovh" }
            - { name: GITEA_RUNNER_NAME, value: Runner1 }
            - { name: DOCKER_HOST, value: "unix:///run/dind/docker.sock" }
          envFrom:
            - secretRef: { name: gitea-runner }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
          volumeMounts:
            - { name: dind-sock, mountPath: /run/dind }
      volumes:
        - { name: docker, emptyDir: {} }
        - { name: dind-sock, emptyDir: {} }
